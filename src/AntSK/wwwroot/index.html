            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "AntSK 和 Dify、RAGFlow 有什么区别？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dify 是 Python 技术栈的通用 LLM 应用开发平台，生态最大、工作流能力最强；RAGFlow 是 Python 技术栈的深度文档解析 RAG 引擎，复杂文档解析精度更高；AntSK 是 .NET 9 技术栈的企业级知识库与智能体平台，优势在于企业级架构、内置 RBAC 权限、全链路本地离线运行、国产信创适配以及软硬一体的 AI 一体机交付能力。.NET/C# 团队选 AntSK 可零迁移成本。"
          }
        },
        {
          "@type": "Question",
          "name": "AntSK 支持哪些大模型和数据库？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "大模型方面支持 OpenAI、Azure OpenAI、讯飞星火、阿里云百炼/灵积等云端模型，以及 Ollama、LLamaFactory、llama.cpp(GGUF) 等本地离线模型。数据库方面支持 PostgreSQL、SQLite、MySQL、SQL Server、Oracle 与国产达梦；向量库支持 PostgreSQL(pgvector)、Qdrant、Redis、Disk、Memory 与 Azure AI Search。"
          }
        },
        {
          "@type": "Question",
          "name": "AntSK 部署难度和环境要求如何？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AntSK 使用 Docker 一行命令即可启动，最低 4 核 CPU / 8GB 内存 / 50GB SSD 可运行，默认使用 SQLite + Disk 存储无需额外搭建数据库。推荐配置为 8 核 CPU / 16GB 内存并可选 GPU 加速；生产环境建议 16 核 CPU / 32GB 内存 / RTX 3080 以上。"
          }
        },
        {
          "@type": "Question",
          "name": "AntSK 的默认账号密码是什么？如何保证安全？",
          "acceptedAnswer": {

          }

        <h1>AntSK - 企业级大模型 AI 知识库与 AI 一体机</h1>
        <p>
            AntSK（Ant Semantic Kernel）是基于 .NET 9 + Blazor + Semantic Kernel + Kernel Memory 打造的
            企业级大模型 AI 知识库与智能体平台，支持本地离线大模型运行、私有化部署与国产信创适配，
            并提供 32B / 70B 梯度配置的 AI 一体机交付方案。
        </p>
        <h2>核心能力</h2>
        <ul>
            <li>企业知识库：导入 Word、PDF、Excel、TXT、Markdown、JSON、PPT 并进行智能问答</li>
            <li>本地离线运行：支持 Ollama、LLamaFactory、llama.cpp(GGUF) 与 BGE embedding / rerank</li>
            <li>国产信创适配：兼容国产大模型与国产数据库（含达梦）</li>
            <li>知识图谱 GraphRAG 与自然语言转 SQL（Text2Sql）——AntSK Pro 商业版</li>
            <li>开放插件系统：.NET DLL 插件、OpenAPI 插件与函数插件</li>
            <li>OpenAI 兼容 API：/api/v1/chat/completions 与 /api/v1/rerank</li>
            <li>RBAC 角色权限管理、OCR 文字识别、Stable Diffusion 文生图</li>
        </ul>
        <h2>相关链接</h2>
        <ul>
            <li>官网：<a href="https://antsk.cn/">https://antsk.cn/</a></li>
            <li>开源仓库：<a href="https://github.com/AIDotNet/AntSK">https://github.com/AIDotNet/AntSK</a></li>
            <li>LLM 结构化导览：<a href="/llms.txt">/llms.txt</a></li>
            <li>LLM 完整说明：<a href="/llms-full.txt">/llms-full.txt</a></li>
        </ul>
        <p>本系统为 Blazor Server 应用，请启用 JavaScript 以获得完整体验。</p>

            .ant-spin-spinning {
                position: static;
                display: inline-block;
                opacity: 1;
            }

            .ant-spin-dot {
                position: relative;
                display: inline-block;
                font-size: 20px;
                width: 20px;
                height: 20px;
            }

            .ant-spin-dot-item {
                position: absolute;
                display: block;
                width: 9px;
                height: 9px;
                background-color: #1890ff;
                border-radius: 100%;
                -webkit-transform: scale(0.75);
                -ms-transform: scale(0.75);
                transform: scale(0.75);
                -webkit-transform-origin: 50% 50%;
                -ms-transform-origin: 50% 50%;
                transform-origin: 50% 50%;
                opacity: 0.3;
                -webkit-animation: antSpinMove 1s infinite linear alternate;
                animation: antSpinMove 1s infinite linear alternate;
            }

            .ant-spin-dot-item:nth-child(1) {
                top: 0;
                left: 0;
            }

            .ant-spin-dot-item:nth-child(2) {
                top: 0;
                right: 0;
                -webkit-animation-delay: 0.4s;
                animation-delay: 0.4s;
            }

            .ant-spin-dot-item:nth-child(3) {
                right: 0;
                bottom: 0;
                -webkit-animation-delay: 0.8s;
                animation-delay: 0.8s;
            }

            .ant-spin-dot-item:nth-child(4) {
                bottom: 0;
                left: 0;
                -webkit-animation-delay: 1.2s;
                animation-delay: 1.2s;
            }

            .ant-spin-dot-spin {
                -webkit-transform: rotate(45deg);
                -ms-transform: rotate(45deg);
                transform: rotate(45deg);
                -webkit-animation: antRotate 1.2s infinite linear;
                animation: antRotate 1.2s infinite linear;
            }

            .ant-spin-lg .ant-spin-dot {
                font-size: 32px;
                width: 32px;
                height: 32px;
            }

            .ant-spin-lg .ant-spin-dot i {
                width: 14px;
                height: 14px;
            }

            @media all and (-ms-high-contrast: none),
            (-ms-high-contrast: active) {
                .ant-spin-blur {
                    background: #fff;
                    opacity: 0.5;
                }
            }

            @-webkit-keyframes antSpinMove {
                to {
                    opacity: 1;
                }
            }

            @keyframes antSpinMove {
                to {
                    opacity: 1;
                }
            }

            @-webkit-keyframes antRotate {
                to {
                    -webkit-transform: rotate(405deg);
                    transform: rotate(405deg);
                }
            }

            @keyframes antRotate {
                to {
                    -webkit-transform: rotate(405deg);
                    transform: rotate(405deg);
                }
            }
